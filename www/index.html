<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Switch status</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='4' width='14' height='8' rx='1.5' fill='%232f6fdf'/%3E%3Cpath d='M4 7h1v2H4zm2.5 0h1v2h-1zM9 7h1v2H9zm2.5 0h1v2h-1z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <div class="title">
      <h1 id="hostname">Switch</h1>
      <span id="firmware" class="muted"></span>
    </div>
    <nav>
      <span id="status" class="muted"></span>
      <button id="refresh" type="button">Refresh</button>
      <a id="update" class="button" target="_blank" rel="noopener">Firmware update</a>
    </nav>
  </header>

  <main>
    <p id="error" class="error" role="alert" hidden></p>

    <section class="card">
      <h2>System</h2>
      <dl id="system" class="facts"></dl>
    </section>

    <section class="card">
      <h2>Management</h2>
      <div id="management"></div>
    </section>

    <section class="card wide">
      <h2>Ports</h2>
      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>Port</th><th>Link</th><th>VLAN</th><th>Description</th>
              <th class="num">Received</th><th class="num">Sent</th><th>MAC address</th>
            </tr>
          </thead>
          <tbody id="ports"></tbody>
        </table>
      </div>
    </section>

    <section class="card wide">
      <h2 id="vlans-title">VLANs</h2>
      <div class="scroll">
        <table>
          <thead id="vlans-head"></thead>
          <tbody id="vlans"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="muted">
    Read-only view of the switch's RESTCONF data. Configure the switch with
    <code>ssh cli@<span id="host"></span></code> or RESTCONF.
  </footer>
</body>
</html>
