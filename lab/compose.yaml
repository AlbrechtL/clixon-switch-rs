# 5 switches in a ring, sw1 the root.
# Generated by: lab/gen-compose.py ring
# Start with lab/up.sh -f <this file>, drive with LAB_COMPOSE=<this file>
# lab/labctl.py. See lab/README.md.

name: clixon-lab

x-switch: &switch
  # Built by lab/up.sh: compose's builder does not see the local dev image.
  image: clixon-switch-lab
  init: true
  cap_add:
    - NET_ADMIN
    # mstpd answers mstpctl with SCM_CREDENTIALS, which needs CAP_SYS_ADMIN.
    - SYS_ADMIN
  healthcheck:
    test: ["CMD", "test", "-f", "/tmp/ready"]
    interval: 1s
    retries: 120

# IPv6 only: see lab/gen-compose.py.
x-link: &link
  driver: bridge
  enable_ipv4: false
  enable_ipv6: true

services:
  sw1:
    <<: *switch
    hostname: sw1
    environment:
      SWITCH_PORTS: lan1 lan2
      SWITCH_ADDRESS: 192.168.1.1/16
      STP_PROTOCOL: RSTP
      STP_BRIDGE_PRIORITY: 4096
    networks:
      default: {gw_priority: 1}
      sw5-sw1: {interface_name: lan1}
      sw1-sw2: {interface_name: lan2}

  sw2:
    <<: *switch
    hostname: sw2
    environment:
      SWITCH_PORTS: lan1 lan2
      SWITCH_ADDRESS: 192.168.1.2/16
      STP_PROTOCOL: RSTP
    networks:
      default: {gw_priority: 1}
      sw1-sw2: {interface_name: lan1}
      sw2-sw3: {interface_name: lan2}

  sw3:
    <<: *switch
    hostname: sw3
    environment:
      SWITCH_PORTS: lan1 lan2
      SWITCH_ADDRESS: 192.168.1.3/16
      STP_PROTOCOL: RSTP
    networks:
      default: {gw_priority: 1}
      sw2-sw3: {interface_name: lan1}
      sw3-sw4: {interface_name: lan2}

  sw4:
    <<: *switch
    hostname: sw4
    environment:
      SWITCH_PORTS: lan1 lan2
      SWITCH_ADDRESS: 192.168.1.4/16
      STP_PROTOCOL: RSTP
    networks:
      default: {gw_priority: 1}
      sw3-sw4: {interface_name: lan1}
      sw4-sw5: {interface_name: lan2}

  sw5:
    <<: *switch
    hostname: sw5
    environment:
      SWITCH_PORTS: lan1 lan2
      SWITCH_ADDRESS: 192.168.1.5/16
      STP_PROTOCOL: RSTP
    networks:
      default: {gw_priority: 1}
      sw4-sw5: {interface_name: lan1}
      sw5-sw1: {interface_name: lan2}

networks:
  default: {}
  sw1-sw2: *link
  sw2-sw3: *link
  sw3-sw4: *link
  sw4-sw5: *link
  sw5-sw1: *link
