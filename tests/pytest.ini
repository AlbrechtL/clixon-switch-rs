[pytest]
# The repository is mounted read-only in the dev container, so nothing pytest
# writes may land beside the sources.
cache_dir = /tmp/pytest_cache
addopts = --basetemp=/tmp/pytest -ra
pythonpath = .
testpaths = switch clab
markers =
    restart: needs a cold backend; restores the startup database first
    clab: needs containerlab and a deployed topology
    converge: needs spanning tree to converge, so a kernel with bridge stp_mode
    interop: needs a third-party network OS image that is not redistributable
