name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the compiler to the one oe-core ships.
      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Only the pure crates: the clixon ones link libclixon, which lives in
      # the dev container.
      - name: Unit tests
        run: cargo test

      # The vendored modules must be exactly the import closure of yang/, at
      # the pinned openconfig/public release.
      - name: Vendored YANG is up to date
        run: |
          git clone --quiet --filter=blob:none --branch v5.3.0 \
              https://github.com/openconfig/public.git /tmp/openconfig-public
          scripts/vendor-yang.sh /tmp/openconfig-public
          git diff --exit-code yang/vendor

      # Builds clixon at the revisions the Yocto recipes pin, runs it with the
      # plugin against dummy ports, and drives it over RESTCONF.
      - name: Integration tests
        run: dev/container.sh tests/integration/run.sh
